version: 1

formatters:
  simple:
    format: '%(asctime)s | %(name)s | %(levelname)s | %(filename)s:%(lineno)-3s | %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

handlers:
  console:
    class: logging.StreamHandler
    formatter: simple
    stream: ext://sys.stdout

root:
  level: WARNING
  handlers: []

loggers:
  fintorch:
    level: DEBUG
    handlers: [console]

