[tool.poetry]
name = "fintorch"
version = "0.3.0"
description = "Finbright deep learning package"
authors = ["Sahand Nazarzadeh <sahand.nazarzadeh@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.8"
ta = "0.11.0"
torch = "2.1.0"
rich = "13.7.0"
numpy = "1.26.0"
pandas = "2.1.1"
psutil = "5.9.6"
tabulate = "0.9.0"
requests = "2.31.0"
matplotlib = "3.8.0"
apscheduler = "3.10.4"
python-socks = "2.4.3"
mplfinance = "0.12.10b0"
websocket-client = "1.7.0"

[tool.poetry.dev-dependencies]
pytest = "^6.2.4"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"