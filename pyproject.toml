[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fintorch"
version = "0.1.5"
authors = [
  { name="Sahand Nazarzadeh", email="sahand.nazarzadeh@gmail.com" },
]
description = "Finbright deep learning package"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy==1.26.0",
    "pandas==2.1.1",
    "torch==2.0.1",
    "matplotlib==3.8.0"
]
